name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs de test UNIQUEMENT - jamais utilisees en dehors de ce pipeline.
  NODE_ENV: test
  DATABASE_URL: "postgresql://csc_test:csc_test@localhost:5432/csc_test?schema=public"
  REDIS_URL: "redis://localhost:6379"
  JWT_ACCESS_SECRET: "ci_only_access_secret_do_not_reuse_00000000000000"
  JWT_REFRESH_SECRET: "ci_only_refresh_secret_do_not_reuse_0000000000000"
  COOKIE_DOMAIN: "localhost"
  CORS_ORIGINS: "http://localhost:3000"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: csc_test
          POSTGRES_PASSWORD: csc_test
          POSTGRES_DB: csc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U csc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generer le client Prisma
        run: pnpm db:generate

      - name: Appliquer les migrations (base de test)
        run: pnpm --filter api prisma:deploy

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit des dependances (haute severite)
        run: pnpm audit --audit-level=high
        continue-on-error: true # a retirer une fois la baseline de vulnerabilites nettoyee

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
